# ImmoRadar op Render — Blueprint (Dashboard → Blueprints → New Blueprint Instance).
#
# Alles in Frankfurt. Eén webservice, één worker, één database; web en worker
# delen dezelfde Dockerfile en dezelfde omgevingsgroep. De web-service migreert
# bij het opstarten, de worker nooit.
#
# Bij het aanmaken vraagt Render om APP_BASE_URL (web én worker, dezelfde
# https-URL) en om LEGAL_ENTITY_ADDRESS / LEGAL_CONTACT_EMAIL.
# Na de eerste deploy: TRUSTED_PROXY_HOPS controleren in Beheer → Systeem →
# Proxy-diagnose en zo nodig aanpassen in de groep `immoradar-prod`.
# Draaiboek: docs/DEPLOY-RENDER.md.

envVarGroups:
  - name: immoradar-prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      # Pilot = LeadRevive: geen marktbronnen, geen demo- of fixturebron.
      - key: COLLECTOR_ENABLED_SOURCES
        value: ''
      # Leeg = geen Telegram-meldingen (pilotovereenkomst: standaard uit).
      - key: TELEGRAM_BOT_TOKEN
        value: ''
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: RETENTION_CRM_CONTACT_DAYS
        value: '3650'
      - key: RETENTION_IMPORT_ROWS_DAYS
        value: '90'
      - key: LEGAL_ENTITY_NAME
        value: Marhaba Data & AI Agent BV
      - key: LEGAL_ENTITY_VAT
        value: BE1003552102

services:
  - type: web
    name: immoradar-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "npx prisma migrate deploy && npm start"
    healthCheckPath: /api/ready
    envVars:
      - fromGroup: immoradar-prod
      # Een omgevingsgroep kan geen gegenereerde of in te vullen waarden
      # bevatten; die staan daarom per service.
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: LEGAL_ENTITY_ADDRESS
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: immoradar-db
          property: connectionString

  - type: worker
    name: immoradar-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run worker
    envVars:
      - fromGroup: immoradar-prod
      # De worker ondertekent geen sessies; hij controleert alleen dat er een
      # geheim is. Een eigen gegenereerde waarde volstaat.
      - key: SESSION_SECRET
        generateValue: true
      # Links in meldingen; zelfde waarde als bij de webservice.
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: immoradar-db
          property: connectionString

databases:
  - name: immoradar-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    databaseName: immoradar
    user: immoradar
    # Geen toegang van buitenaf: alleen web en worker (intern netwerk).
    ipAllowList: []
